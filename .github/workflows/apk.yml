name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7-stable
  GODOT_TEMPLATES_DIR: 4.7.stable
  GODOT_TEMPLATES_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
  GODOT_EDITOR_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
  ANDROID_COMPILE_SDK: 36
  ANDROID_BUILD_TOOLS: 36.1.0

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: godot-editor
          key: godot-editor-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot editor
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          mkdir godot-editor-tmp
          curl -fsSL "$GODOT_EDITOR_URL" -o editor.zip
          unzip -q editor.zip -d godot-editor-tmp
          mv godot-editor-tmp/Godot_v4.7-stable_linux.x86_64 godot-editor
          rm -rf godot-editor-tmp editor.zip
          chmod +x godot-editor

      - name: Import assets
        run: ./godot-editor --headless --import

      - name: Run integration tests
        run: ./godot-editor --headless tests/integration_test.tscn

  apk:
    name: Gradle APK build
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          ANDROID_ROOT=/usr/local/lib/android/sdk
          sudo mkdir -p "$ANDROID_ROOT/cmdline-tools"
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_ROOT"
          LATEST=$(curl -fsSL https://dl.google.com/android/repository/repository2-3.xml \
            | grep -oE "commandlinetools-linux-[0-9]+_latest\.zip" \
            | sed 's/commandlinetools-linux-//;s/_latest\.zip//' \
            | sort -n | tail -1)
          echo "Latest Android cmdline-tools: $LATEST"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-${LATEST}_latest.zip" -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_ROOT/clt.tmp"
          mv "$ANDROID_ROOT/clt.tmp/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          rm -rf "$ANDROID_ROOT/clt.tmp" /tmp/clt.zip
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_ROOT/cmdline-tools/latest/bin:$ANDROID_ROOT/platform-tools:$PATH" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Cache Godot editor + export templates
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: |
            godot-editor
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_TEMPLATES_DIR }}-linux-x86_64-templates

      - name: Download Godot editor and export templates
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          mkdir godot-editor-tmp
          curl -fsSL "$GODOT_EDITOR_URL" -o editor.zip
          unzip -q editor.zip -d godot-editor-tmp
          mv godot-editor-tmp/Godot_v4.7-stable_linux.x86_64 godot-editor
          rm -rf godot-editor-tmp editor.zip
          chmod +x godot-editor

          curl -fsSL "$GODOT_TEMPLATES_URL" -o templates.tpz
          TMPD=$(mktemp -d)
          unzip -q templates.tpz -d "$TMPD"
          rm templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv "$TMPD/templates" "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATES_DIR"
          rm -rf "$TMPD"

      - name: Write Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.config/godot/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using existing keystore from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          else
            echo "No keystore secrets found, generating a new one"
            PASS=$(openssl rand -base64 24)
            ALIAS=shreksim-ci
            keytool -genkeypair -v -keystore release.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=ShrekSim, OU=Games, O=Matko802, C=SK"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"

      - name: Import assets
        run: ./godot-editor --headless --import

      - name: Export release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KEYSTORE_PATH }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ env.KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          ./godot-editor --headless --install-android-build-template --export-release "Android" build/ShrekSim.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify build/ShrekSim.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShrekSim-APK-${{ github.sha }}
          path: build/ShrekSim.apk
          if-no-files-found: error

      - name: Create GitHub release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum build/ShrekSim.apk > ShrekSim.apk.sha256
          cp build/ShrekSim.apk "ShrekSim-${{ github.ref_name }}-arm64.apk"
          gh release create "${{ github.ref_name }}" \
            "ShrekSim-${{ github.ref_name }}-arm64.apk" \
            "ShrekSim.apk.sha256" \
            --title "${{ github.ref_name }}" \
            --notes "Android APK build ${{ github.ref_name }} (arm64). On mobile the terrain now uses the lightweight ground shader, so the ground no longer runs the heavy multi texture shader and looking at the ground should hold fps much better. If you installed an older signed build, uninstall it before installing this one."
